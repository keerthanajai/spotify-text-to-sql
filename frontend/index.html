<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Text to SQL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex
        }

        /* Sidebar */
        #sidebar {
            width: 260px;
            min-height: 100vh;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0
        }

        #sidebar h2 {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 16px;
            margin-bottom: 12px
        }

        #history-list {
            flex: 1;
            overflow-y: auto
        }

        .history-item {
            padding: 10px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s
        }

        .history-item:hover {
            background: #0f172a;
            border-left-color: #6366f1
        }

        .history-item.active {
            background: #0f172a;
            border-left-color: #6366f1
        }

        .history-item p {
            font-size: 0.85rem;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .history-item span {
            font-size: 0.7rem;
            color: #475569
        }

        #clear-btn {
            margin: 12px 16px 0;
            padding: 8px;
            background: transparent;
            border: 1px solid #334155;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem
        }

        #clear-btn:hover {
            border-color: #f87171;
            color: #f87171
        }

        /* Main */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
            overflow-y: auto
        }

        .logo {
            font-size: 2rem;
            margin-bottom: 6px
        }

        h1 {
            font-size: 1.6rem;
            color: #f8fafc;
            margin-bottom: 6px
        }

        .sub {
            color: #64748b;
            margin-bottom: 28px;
            font-size: 0.95rem
        }

        /* Input */
        .input-wrap {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 720px;
            margin-bottom: 12px
        }

        input {
            flex: 1;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s
        }

        input:focus {
            border-color: #6366f1
        }

        button.ask-btn {
            padding: 13px 24px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap
        }

        button.ask-btn:hover {
            background: #4f46e5
        }

        button.ask-btn:disabled {
            background: #334155;
            cursor: not-allowed
        }

        /* Suggestions */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            max-width: 720px;
            margin-bottom: 28px
        }

        .chip {
            padding: 6px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s
        }

        .chip:hover {
            border-color: #6366f1;
            color: #a5b4fc
        }

        /* Output */
        #output {
            width: 100%;
            max-width: 720px
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #334155
        }

        .label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 10px
        }

        pre {
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #7dd3fc;
            overflow-x: auto;
            white-space: pre-wrap;
            line-height: 1.6
        }

        .summary-text {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.7
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
            margin-top: 8px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: #0f172a;
            padding: 10px 14px;
            text-align: left;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em
        }

        td {
            padding: 10px 14px;
            border-top: 1px solid #1e293b;
            font-size: 0.9rem;
            color: #e2e8f0
        }

        tr:hover td {
            background: #0f172a55
        }

        .spinner {
            color: #64748b;
            text-align: center;
            padding: 40px;
            font-size: 0.95rem
        }

        .error-card {
            background: #1e293b;
            border: 1px solid #7f1d1d;
            border-radius: 12px;
            padding: 20px;
            color: #f87171;
            margin-bottom: 16px
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2>Query History</h2>
        <div id="history-list"></div>
        <button id="clear-btn" onclick="clearHistory()">Clear history</button>
    </div>

    <div id="main">
        <div class="logo">🎵</div>
        <h1>Spotify Text to SQL</h1>
        <p class="sub">Ask anything about 90K tracks and global streaming data</p>

        <div class="input-wrap">
            <input id="question" type="text" placeholder="e.g. Which genre is most popular in Brazil?" />
            <button class="ask-btn" id="askBtn" onclick="ask()">Ask</button>
        </div>

        <div class="suggestions">
            <span class="chip" onclick="fillAndAsk('Who are the top 10 most featured artists across all playlists?')">🎤
                Top
                artists</span>
            <span class="chip" onclick="fillAndAsk('What are the top 10 most popular tracks across all playlists?')">🎵
                Top
                tracks</span>
            <span class="chip"
                onclick="fillAndAsk('What is the average number of followers for collaborative vs non-collaborative playlists?')">👥
                Collab playlists</span>
            <span class="chip" onclick="fillAndAsk('Which artist appears in the most unique playlists?')">🏆 Most
                playlisted
                artist</span>
            <span class="chip" onclick="fillAndAsk('What are the top 5 longest playlists by total duration?')">⏱ Longest
                playlists</span>
        </div>

        <div id="output"></div>
    </div>

    <script>
        let history = [];

        document.getElementById("question").addEventListener("keydown", e => {
            if (e.key === "Enter") ask();
        });

        function fillAndAsk(q) {
            document.getElementById("question").value = q;
            ask();
        }

        async function ask() {
            const question = document.getElementById("question").value.trim();
            if (!question) return;

            const output = document.getElementById("output");
            const btn = document.getElementById("askBtn");
            btn.disabled = true;
            output.innerHTML = '<div class="spinner">⏳ Generating SQL and querying Snowflake...</div>';

            try {
                const res = await fetch("http://localhost:8000/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question, history: history.slice(-3) })
                });
                const data = await res.json();
                if (data.detail) throw new Error(data.detail);

                const entry = {
                    question,
                    sql: data.sql,
                    columns: data.columns,
                    rows: data.rows,
                    summary: data.summary,
                    time: new Date().toLocaleTimeString()
                };
                history.push(entry);
                renderHistory();
                renderResult(data);

            } catch (err) {
                output.innerHTML = `<div class="error-card">❌ Error: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function renderResult(data) {
            const output = document.getElementById("output");
            const cols = data.columns;
            const rows = data.rows;

            const tableRows = rows.map(r =>
                `<tr>${r.map(cell => {
                    if (cell === null) return "<td>—</td>";
                    const num = parseFloat(cell);
                    return `<td>${!isNaN(num) && cell !== "" ? (num % 1 !== 0 ? num.toFixed(2) : cell) : cell}</td>`;
                }).join("")}</tr>`
            ).join("");

            output.innerHTML = `
      <div class="card">
        <div class="label">💬 Summary</div>
        <div class="summary-text">${data.summary}</div>
      </div>
      <div class="card">
        <div class="label">Generated SQL</div>
        <pre>${data.sql}</pre>
      </div>
      <div class="card">
        <div class="label">Results (${rows.length} row${rows.length !== 1 ? "s" : ""})</div>
        <div class="table-wrap">
          <table>
            <thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>`;
        }

        function renderHistory() {
            const list = document.getElementById("history-list");
            list.innerHTML = history.slice().reverse().map((h, i) => `
      <div class="history-item" onclick="reloadHistory(${history.length - 1 - i})">
        <p>${h.question}</p>
        <span>${h.time}</span>
      </div>`).join("");
        }

        function reloadHistory(i) {
            const h = history[i];
            document.getElementById("question").value = h.question;
            renderResult(h);
            document.querySelectorAll(".history-item").forEach((el, j) => {
                el.classList.toggle("active", j === history.length - 1 - i);
            });
        }

        function clearHistory() {
            history = [];
            renderHistory();
            document.getElementById("output").innerHTML = "";
            document.getElementById("question").value = "";
        }
    </script>
</body>

</html>
